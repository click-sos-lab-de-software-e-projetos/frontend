name: click_sos
description: Mapa de calor colaborativo de segurança + botão SOS via WhatsApp.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.1           # usa o FusedLocationProviderClient no Android
  dio: ^5.7.0                   # cliente HTTP
  url_launcher: ^6.3.1          # abre o WhatsApp (wa.me)
  provider: ^6.1.5+1
  flutter_secure_storage: ^11.2.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
