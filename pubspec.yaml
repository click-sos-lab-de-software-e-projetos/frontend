name: alerta_seguro
description: Mapa de calor colaborativo de segurança + botão SOS via WhatsApp.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.9.0   # Google Maps SDK
  geolocator: ^13.0.1           # usa o FusedLocationProviderClient no Android
  dio: ^5.7.0                   # cliente HTTP
  retrofit: ^4.4.1              # Retrofit (gera a camada de API)
  url_launcher: ^6.3.1          # abre o WhatsApp (wa.me)
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  retrofit_generator: ^9.1.5
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
